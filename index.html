<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Warda ❤️</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
  radial-gradient(circle at top,#ffd6dc,#ff9a9e 60%,#ff758c);
  position:relative;
}

/* HEARTS */
.heart{
  position:absolute;
  color:white;
  opacity:.6;
  animation:float 8s linear infinite;
}

@keyframes float{

  0%{
    transform:translateY(100vh) scale(0);
    opacity:0;
  }

  100%{
    transform:translateY(-10vh) scale(1.5);
    opacity:1;
  }

}

/* ENVELOPE */
.container{
  position:relative;
  width:370px;
  height:260px;
  cursor:pointer;
  transition:.4s;
}

.container:hover{
  transform:scale(1.03);
}

.front{
  position:absolute;
  width:100%;
  height:100%;
  background:#ff5e78;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.front::before{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:#ff3f5f;
  clip-path:polygon(0 0,50% 58%,100% 0);
}

.front h2{
  position:absolute;
  width:100%;
  bottom:25px;
  text-align:center;
  color:white;
  letter-spacing:2px;
  font-size:24px;
  text-shadow:0 2px 10px rgba(0,0,0,.2);
}

/* LETTER */
.letter{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:20px;
  width:92%;
  height:0;
  background:#fffaf4;
  border-radius:18px;
  overflow:hidden;
  transition:1.3s ease;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
  padding:0 22px;
}

.container.open .letter{
  height:78vh;
  top:-38vh;
  padding:28px 22px;
  overflow-y:auto;
}

/* SCROLL */
.letter::-webkit-scrollbar{
  width:6px;
}

.letter::-webkit-scrollbar-thumb{
  background:#ff6b81;
  border-radius:20px;
}

/* TEXT */
.text{
  color:#444;
  font-size:15px;
  line-height:2;
  white-space:pre-line;
  text-align:left;
}

/* CURSOR */
.typing::after{
  content:'|';
  animation:blink .7s infinite;
}

@keyframes blink{
  50%{
    opacity:0;
  }
}

/* SIGNATURE */
.signature{
  margin-top:40px;
  text-align:right;
  color:#ff476d;
  font-size:17px;
  font-weight:bold;
  opacity:0;
  transition:2s;
}

.signature.show{
  opacity:1;
}

/* FOOTER */
.music-text{
  position:absolute;
  bottom:35px;
  color:white;
  font-size:15px;
  opacity:.9;
  animation:pulse 2s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.06);
  }

  100%{
    transform:scale(1);
  }

}

/* MOBILE */
@media(max-width:480px){

  .container{
    width:320px;
    height:240px;
  }

}

</style>
</head>

<body>

<!-- HEARTS -->
<script>

for(let i=0;i<45;i++){

  const heart=document.createElement("div");

  heart.classList.add("heart");
  heart.innerHTML="❤";

  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(Math.random()*18+10)+"px";
  heart.style.animationDuration=(Math.random()*5+6)+"s";
  heart.style.animationDelay=Math.random()*5+"s";

  document.body.appendChild(heart);
}

</script>

<!-- ENVELOPE -->
<div class="container" id="openLetter">

  <div class="front">
    <h2>Untuk Warda ❤️</h2>
  </div>

  <div class="letter" id="letterBox">

    <div class="text typing" id="typingText"></div>

    <div class="signature" id="signature">
      — Dari Alwan untuk Warda ❤️
    </div>

  </div>

</div>

<div class="music-text">
  klik suratnya ✨
</div>

<!-- MUSIC -->
<audio id="bgMusic">
  <source src="surat.mp3" type="audio/mp3">
</audio>

<script>

const container = document.getElementById("openLetter");
const music = document.getElementById("bgMusic");
const letter = document.getElementById("letterBox");
const signature = document.getElementById("signature");

const message = `
Warda...

Aku ga pernah tau hidup bakal membawa aku sejauh ini sama kamu.

Awalnya mungkin cuma cerita biasa,
obrolan kecil,
candaan sederhana,
atau hari-hari yang lewat tanpa kita sadar...
kalau ternyata pelan-pelan,
aku mulai menemukan rumah di diri kamu.

Terima kasih...
karena tetap bertahan sejauh ini.

Karena kamu tetap ada,
bahkan waktu aku lagi ga baik-baik aja.

Karena kamu sabar dengerin semua isi kepalaku,
ngerangkul aku di saat keadaan lagi berat,
dan tetap memilih tinggal,
waktu semuanya terasa rumit.

Aku sadar...
aku belum sempurna.

Aku masih banyak kurangnya.
Masih sering bikin kamu khawatir.
Masih belum bisa jadi laki-laki terbaik
yang selalu kamu harapkan.

Tapi di tengah semua kekurangan itu,
ada satu hal yang ga pernah berubah:

aku serius sama kamu.

Aku serius pengen masa depan itu ada kamu di dalamnya.

Aku pengen nanti,
di saat hidup lagi capek-capeknya,
kita tetap pulang ke satu sama lain.

Aku pengen nanti kita bukan cuma jadi dua orang
yang pernah saling mencintai,
tapi dua orang
yang benar-benar bertahan sampai akhir.

Dan akhir-akhir ini...
aku tau semuanya terasa makin dekat.

Rencana,
harapan,
masa depan,
dan langkah besar yang dulu cuma jadi doa.

Kadang aku takut.
Takut belum cukup siap.
Takut belum bisa bahagiain kamu sepenuhnya.

Tapi aku terus berusaha...
karena aku ga mau kehilangan perempuan
yang selama ini selalu bersamaku.

Semoga Tuhan bukain jalan rezeki yang baik buat kita.
Semoga semua yang lagi kita perjuangkan
dipermudah satu per satu.

Aku ga butuh hidup yang sempurna,
asal nanti aku bisa jalaninnya sama kamu.

Dan kalau suatu hari nanti kita sama-sama lelah,
semoga kita ingat...
kalau dulu kita pernah sekuat ini
buat saling mempertahankan.

Karena dari semua hal
yang datang dan pergi dalam hidup aku...

aku cuma pengen kamu tetap jadi tempat pulangku.
`;

let index = 0;
let started = false;

/* TEMPO LEBIH DALAM & SINEMATIK */
function typeText(){

  const typingText = document.getElementById("typingText");

  if(index < message.length){

    typingText.innerHTML += message.charAt(index);

    letter.scrollTop = letter.scrollHeight;

    let speed = 55;

    /* PAUSE EMOSIONAL */
    const currentChar = message.charAt(index);

    if(currentChar === "." || currentChar === "," ){
      speed = 220;
    }

    if(currentChar === "\n"){
      speed = 400;
    }

    index++;

    setTimeout(typeText,speed);

  }else{

    signature.classList.add("show");

  }

}

/* OPEN LETTER */
container.addEventListener("click",()=>{

  container.classList.add("open");

  if(!started){

    music.play();

    setTimeout(()=>{
      typeText();
    },1200);

    started=true;
  }

});

</script>

</body>
</html>
